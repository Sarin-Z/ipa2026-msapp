<html>
<head>
    <title>Sample app</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>You are calling me from {{request.remote_addr}}</h1>
    <form method="POST" action="/add">
    <input name="ip" placeholder="IP" required />
    <input name="username" placeholder="Username" required />
    <input name="password" placeholder="Password" required />
    <button type="submit">Add Router</button>
  </form>

  <ul>
    {% for router in data %}
    <li>
      {{ router.ip }} - {{ router.username }} - {{ router.password }}
      <form method="POST" action="{{ url_for('delete_comment') }}" style="display:inline">
        <input type="hidden" name="id" value="{{ router._id }}">
        <button type="submit">Delete</button>
      </form>
    </li>
    {% endfor %}
  </ul>

</body>
</html>
